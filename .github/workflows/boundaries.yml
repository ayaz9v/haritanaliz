name: Boundaries

# Builds the administrative boundary data (region files, PMTiles, quality report and the
# web sample) from a Geofabrik Türkiye extract. Manual trigger only; download the results
# with `gh run download` (see README.md). tippecanoe has no Windows build, so tiles are
# produced here (docs/decisions.md).

on:
  workflow_dispatch:
    inputs:
      osm_date:
        description: "OSM data date of the extract (YYYY-MM-DD); empty means the latest one"
        required: false
        default: ""
      sample_province:
        description: "Plate code of the province in the web sample"
        required: false
        default: "35"

permissions:
  contents: read

env:
  TIPPECANOE_VERSION: "2.79.0"
  TIPPECANOE_COMMIT: "68ab8dcc229f95b8b25877697d5e8d66783af503"

jobs:
  build:
    name: Build boundary data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_VERSION }}

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git
          test "$(git -C tippecanoe rev-parse HEAD)" = "$TIPPECANOE_COMMIT"
          make -C tippecanoe -j"$(nproc)"
          make -C tippecanoe install PREFIX="$HOME/.local/tippecanoe"

      - name: Add tippecanoe to PATH
        run: |
          echo "$HOME/.local/tippecanoe/bin" >> "$GITHUB_PATH"

      # setup-uv publishes no floating major tags; pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Download OSM extract
        env:
          OSM_DATE: ${{ inputs.osm_date }}
        run: uv run haritanaliz download-osm ${OSM_DATE:+--date "$OSM_DATE"}

      - name: Build boundaries
        run: uv run haritanaliz boundaries

      - name: Build tiles
        run: |
          tippecanoe --version
          uv run haritanaliz tiles

      - name: Build web sample
        env:
          SAMPLE_PROVINCE: ${{ inputs.sample_province }}
        run: uv run haritanaliz sample --province "$SAMPLE_PROVINCE"

      - name: Upload site data
        uses: actions/upload-artifact@v7
        with:
          name: boundaries-site
          path: data/output/site
          retention-days: 14

      - name: Upload sample and report
        uses: actions/upload-artifact@v7
        with:
          name: boundaries-sample-report
          path: |
            apps/web/public/data-sample
            docs/reports
          retention-days: 14
